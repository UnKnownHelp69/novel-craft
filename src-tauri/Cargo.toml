[package]
name = "novelcraft"
version = "1.0.0"
description = "NovelCraft — a distraction-free novel writing studio"
authors = ["NovelCraft"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "novelcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
