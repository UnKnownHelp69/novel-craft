name: Release

# Builds installers for all three desktop platforms and attaches them to a DRAFT
# GitHub Release; a human reviews the draft and publishes it. No tests run here (that is
# ci.yml, on pull requests). The checklist, including why a version must be triggered by
# a tag push OR "Run workflow" but never both, is RELEASING.md.
#
# Not code-signed (no certificates, no notarization), so Windows SmartScreen and macOS
# Gatekeeper warn on the first install. Updates ARE signed, with the updater key in the
# TAURI_SIGNING_PRIVATE_KEY secret (see RELEASING.md); the app checks the signatures against the
# public key in tauri.conf.json before installing anything.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.2.0). Defaults to the version in src-tauri/tauri.conf.json.'
        required: false
        type: string

# Never cancel a release mid-flight: a half-uploaded draft is worse than a slow one.
# The group is per ref, so a tag push (refs/tags/vX.Y.Z) and a manual run (refs/heads/main)
# for the same version do not queue behind each other — they run side by side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-22.04
    outputs:
      published: ${{ steps.published.outputs.found }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail before spending ~15 minutes of build time on a mismatched version, and
      # deliberately do NOT rewrite tauri.conf.json here — bumping the version stays a
      # reviewable commit rather than something CI does behind your back.
      # Without the key, every build job would fail at its very end (signing the updater
      # artifacts); fail here instead, in seconds, with the reason.
      - name: Check the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. Releases sign their updates with it; see RELEASING.md, 'The updater key'."
            exit 1
          fi

      - name: Resolve and check the release version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          config_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [ "${{ github.event_name }}" = "push" ]; then
            requested="${GITHUB_REF_NAME#v}"
            source="git tag ${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_VERSION" ]; then
            requested="$INPUT_VERSION"
            source="workflow_dispatch input"
          else
            requested="$config_version"
            source="src-tauri/tauri.conf.json (no version input given)"
          fi

          echo "requested: $requested  (from $source)"
          echo "tauri.conf.json: $config_version"

          if [ "$requested" != "$config_version" ]; then
            echo "::error::Version mismatch — $source says '$requested' but src-tauri/tauri.conf.json says '$config_version'. Bump the version in src-tauri/tauri.conf.json (and package.json) in a commit, then tag that commit."
            exit 1
          fi

          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "tag=v$requested" >> "$GITHUB_OUTPUT"

      - name: Check for an already published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          found=$(jq -s --arg tag "$TAG" 'any(.[][]; .tag_name == $tag and (.draft | not))' releases.json)
          echo "found=$found" >> "$GITHUB_OUTPUT"

  release:
    if: needs.verify-version.outputs.published == 'false'
    name: Build installers (${{ matrix.platform }})
    needs: verify-version
    outputs:
      release-id: ${{ steps.upload.outputs.releaseId }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04       # .deb, .rpm, .AppImage
            args: ''
            rust-targets: ''
          - platform: windows-latest     # .msi, .exe (NSIS)
            args: ''
            rust-targets: ''
          - platform: macos-latest       # one universal .dmg for Intel + Apple Silicon
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # All three jobs target the same tag; the action creates the draft release on
      # first use and uploads into the existing one afterwards.
      - name: Build and attach to draft release
        id: upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (.sig files) that installed copies verify before updating.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.verify-version.outputs.tag }}
          releaseName: NovelCraft ${{ needs.verify-version.outputs.tag }}
          releaseBody: |
            Download the installer for your platform below.

            - **Windows** — `.msi` or `-setup.exe`
            - **macOS** — `.dmg` (universal: Apple Silicon and Intel)
            - **Linux** — `.AppImage`, `.deb` or `.rpm`

            These builds are **not code-signed yet**, so Windows SmartScreen and macOS
            Gatekeeper will warn on first launch. On Windows choose "More info" then
            "Run anyway"; on macOS right-click the app and choose "Open".
          releaseDraft: true
          prerelease: false
          # latest.json: the manifest installed copies read (via releases/latest) to find updates.
          uploadUpdaterJson: true
          # Update packages are only built for releases: PR builds have no signing key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  updater-manifest:
    name: Finalize updater download URLs
    needs: [verify-version, release]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify-version.outputs.tag }}
      RELEASE_ID: ${{ needs.release.outputs.release-id }}
    steps:
      - name: Resolve signed packages against the completed draft
        run: |
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "$TAG" '.draft and .tag_name == $tag' release.json
          gh release download "$TAG" --pattern latest.json
          jq -e --slurpfile release release.json '
            ($release[0].assets | map({key: .url, value: .browser_download_url}) | from_entries) as $urls
            | if (.platforms | length) == 0 then error("empty platform list") else . end
            | .platforms[] |= (.url = ($urls[.url] // (if (.url | IN($urls[])) then .url else error("unknown package URL") end)))
          ' latest.json > public.json
          mv public.json latest.json
          gh release upload "$TAG" latest.json --clobber
